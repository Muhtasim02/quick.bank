<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Bank - Sign Up</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="form-container">
  <h2>Create Account</h2>

  <form id="signupForm">
    <input type="text" id="name" placeholder="Full Name" required>

    <input type="text" id="parent" placeholder="Parent Name" required>

    <input type="text" id="nationality" placeholder="Nationality" required>

    <input type="text" id="work" placeholder="Occupation" required>

    <input type="date" id="dob" required>

    <input type="email" id="email" placeholder="Email" required>

    <input type="password" id="password" placeholder="Password" required>

    <button type="submit" class="btn">Save</button>
  </form>
</div>

<script src="signup.js"></script>

</body>
</html>
